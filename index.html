{background:#e8eef9;color:#2a4a8a;border-radius:20px;padding:1px 8px;font-size:11px}.badge{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;vertical-align:middle}.badge.ok{background:#e3f5ee;color:#11734f}.badge.bad{background:#fde8e6;color:#a8291c}.badge.mid{background:#fff3d6;color:#8a5a00}.badge.idle{background:#edf1f4;color:#55697a}.checks{list-style:none;padding:0;line-height:1.5}.checks li{margin:10px 0}.checks li.fail{color:#a8291c}.checks li.pass{color:#11734f}button.link{border:0;background:none;color:#175479;text-decoration:underline;padding:2px 4px;min-height:0;font-size:14px}.confirm{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;margin:6px 0}.confirm input{width:22px;height:22px;flex:none}button:disabled{opacity:.45}details summary{cursor:pointer;font-weight:700;color:#175479;padding:6px 0}.hist{padding-left:18px;line-height:1.5;font-size:14px}.hist li{margin:6px 0}details.inst{border-top:1px solid #e3ebf0;padding:10px 0}details.inst summary{font-weight:400;color:#193149}footer button{padding:10px 6px}@media print{footer,.primary{display:none}}</style></head><body><header><h1>DxI 9000 PM Guide</h1><div style="font-size:12px;margin-top:5px">PM-A / PM-B · Guided Service Instructions · iPhone SE+</div></header><main id="app"><div class="card"><h2>DxI 9000 PM-A / PM-B</h2><p>Loading instructions…</p></div></main><footer><button id="setup">New PM</button><button id="instruments">Instruments</button><button id="records">Saved Records</button></footer><script src="instruments.js"></script><script>
function pmWorkflowV2(type){
 const common=[
 {s:'Preparation & Verification',t:'PM Event Details',fields:['wo','startCount','failures'],m:'Confirm Account / IN / SN. Enter the new Work Order and starting Total Test Number for this PM. Record any pre-existing failures or actions. WO and test count belong to this PM event, not the fixed instrument master.'},
 {s:'Initial Evaluation',t:'Bypass interlock, pause and unload reagent packs',m:'Bypass the interlock and pause the console as directed by the procedure. Remove the RSM reagent storage door, then unload all reagent packs and store them refrigerated. Keep packs upright and avoid handling the elastomeric seal.'},
 {s:'Initial Evaluation',t:'Verify cooling fans',m:'With the RSM reagent storage door removed, verify all three RSM cooling fans. Also verify the three instrument case fans and the main rear blower are operating.'},
 {s:'Initial Evaluation',t:'RSM nests and storage',m:'Inspect the pipetting nests and the inside of the reagent storage. Remove fallen packs and debris, wipe condensation, remove and clean the pipetting nest cover, and inspect and clean the tensioners.'},
 {s:'Initial Evaluation',t:'RSM top guide shaft and red bushing (D0518)',m:'Inspect the top guide shaft and the red bushing (D0518). Clean any green debris; replace the red bushing (D0518) if required. Clean and lubricate the guide shafts with the specified lubricants.'},
 {s:'Initial Evaluation',t:'RSM gripper check',m:'Move the RSM gripper assembly left and right (Z-axis) and inspect the gap at the top guide red bushing; a gap suggests a bent bottom Z-axis torque tube. Move it up and down (X-axis) and check that the belt and the Z-axis torque tube barrier stay aligned. Refit the RSM reagent storage door.'},
 {s:'Initial Evaluation',t:'Power off and disconnect',m:'Turn the instrument off using the approved procedure, then disconnect the instrument power cord from the power source.'},
 {s:'Subsystem Maintenance',t:'Tip Supply',m:'Open and slide out the tip supply. Inspect for fallen tips/debris, clean as needed, then close the tip supply.'},
 {s:'Subsystem Maintenance',t:'Sample Pipettors',m:'Move pipettors to the left-most position. With DI water and lint-free material, inspect/clean sample pipettor mandrels, camera covers, aliquot backlight and collision-detection sensor flag areas. If LAS is fitted, inspect/clean the second aliquot backlight.'},
 {s:'Subsystem Maintenance',t:'Bulk Feeder & Supply Shuttle',m:'Inspect bulk vessel feeder, supply carriage and surrounding chassis. Remove fallen vessels. Clean the supply carriage alignment jumper pin with a moistened lint-free cloth.'},
 {s:'Subsystem Maintenance',t:'Sample Presentation Unit (SPU)',m:'Inspect and clean debris/spills in onload, presentation and offload areas, including barcode reader camera lens. Clean onload/offload sensors with DI-water-moistened swab. Clean rails and manually slide a rack to verify smooth movement.'},
 {s:'Subsystem Maintenance',t:'Reagent Pipettors & Wash Towers',m:type==='B'?'Remove/clean wash tower nozzles and service O-rings as directed by the current procedure. For 12-month/120,000-test PM, replace each reagent pipettor probe tip and use torque wrench PN 7343A as specified.':'Inspect/service wash tower nozzles and O-rings according to the current released PM procedure. This workflow keeps 12-month-only reagent probe-tip replacement out of PM-A.'},
 {s:'Subsystem Maintenance',t:'Substrate Loader',m:'Inspect and clean the substrate loader assembly, including the barcode reader camera.'},
 {s:'Subsystem Maintenance',t:'Solid Waste Drawer',m:'Remove waste bag/bin as needed and clean spills/debris. Remove and clean deflector tray. Clean the transparent bag-detect sensor window and reflector.'},
 {s:'Subsystem Maintenance',t:'Wash Buffer Supply Drawer',m:'Remove wash buffer containers and clean drawer. Check tubing for kinks/damage through drawer movement. Inspect wash buffer pump for leakage/damage.'},
 {s:'Subsystem Maintenance',t:'Fluidics Drawer',m:'Inspect/clean lower-right fluidics area. Clean air filter as specified, inspect tray for leaks/spills, clean/repair as needed, then refit and close.'},
 {s:'Subsystem Maintenance',t:'Wash Wheel & Pumps',m:(type==='B'?'Replace DxI 9000-specific peri-pump tubing; inspect tubing/Y-fittings, wash wheel, ejector plate, mixer belt/pulleys, gripper/spinner/ejector, QS probe and wash-wheel camera; install new aspirate probes and verify spring movement. For 12-month PM, clean/lubricate wash-wheel syringe-pump drive gears and linear slides.':'Replace/inspect DxI 9000-specific wash-wheel components as required by the current PM-A procedure, including aspirate probes; inspect tubing/Y-fittings, wash wheel, ejector/mixer/gripper/spinner areas, QS probe and wash-wheel camera. Do not use DxI 600/800 or Access 2 peri-pump tubing.')},
 {s:'Subsystem Maintenance',t:'Reagent Syringe Pumps',m:type==='B'?'Inspect and clean all eight reagent syringe pumps. For 12-month/120,000-test PM, clean and lubricate reagent pipettor syringe-pump drive gears and linear slides with the specified grease.':'Inspect reagent syringe pump area as applicable to the released PM-A procedure. The drive-gear/linear-slide lubrication is a 12-month/120,000-test task in the supplied manual.'},
 {s:'Subsystem Maintenance',t:'Pick and Place',m:'Inspect Sample, Incubator and Analytic PnP collets and clean fluid/debris. Collet removal is not required unless excessively soiled.'},
 {s:'Subsystem Maintenance',t:'Incubate Wheel',m:'Remove cover, remove fallen vessels/debris, clean, and clean alignment jumper pins with moistened lint-free cloth.'},
 {s:'Subsystem Maintenance',t:'Luminometer',m:'Clean the jumper pin and inspect for external spills.'},
 {s:'Subsystem Maintenance',t:'Solid Waste Chutes',m:'Clean the two tip and two vessel solid-waste chutes, including disposable tip removers.'},
 {s:'Subsystem Maintenance',t:'Reagent Shuttles',m:'Inspect and clean the four reagent shuttles (reaction build carriages), including alignment jumper pins.'},
 {s:'Subsystem Maintenance',t:'Pneumatics',m:'Remove left rear panel. Inspect pneumatic accumulator jar for excessive liquid (>1 inch). If present, after power-up verify condensation relief valve operation using the approved Machine Control procedure; replace only as required.'},
 {s:'Subsystem Maintenance',t:'Sample Wheel',m:'Remove cover, remove fallen vessels/debris, clean, and clean alignment jumper pins with moistened lint-free cloth.'},
 {s:'Calibration / Alignment / Prime',t:'Power on and initialize',m:'Turn on instrument, close covers, initialize to GREEN (Ready), sign out of LabUser and sign in with BeckmanAdmin, then follow the manual preparation steps before calibration/alignment.'},
 {s:'Calibration / Alignment / Prime',t:'Ultrasonic transducer calibration',m:'For each reagent pipettor, drain fluid from the tip at the transducer connection, calibrate the transducer and verify voltage according to the Ultrasonics Transducer calibration procedure.'},
 ...(type==='B'?[{s:'Calibration / Alignment / Prime',t:'12-month alignments',m:'Perform reagent pipettor alignments to reagent shuttles, wash towers and reagent storage; aliquot/precision sample pipettor alignments to applicable targets; auto-align DispoTip stocker tray gripper; auto-align wash wheel.'}]:[]),
 {s:'Calibration / Alignment / Prime',t:'Prime all fluidics',m:'Prime all fluidics and verify no leakage. Multiple cycles may be required to purge air. Repeat until bubbles are gone.'},
 {s:'Calibration / Alignment / Prime',t:'RSM gripper timing',m:'Perform RSM gripper timing calibration using the approved calibration procedure.'},
 {s:'Calibration / Alignment / Prime',t:'Reload reagents & RSM remap',m:'Reload previously removed reagent packs and perform an RSM remap.'},
 {s:'Calibration / Alignment / Prime',t:'Backup configuration & databases',m:'Back up alignment/configuration data and databases using the Service App. Follow the supplied manual retention step for backups older than six months.'},
 {s:'Verification',t:'PM Verification',m:'Perform the applicable preventive-maintenance verification. If additional components were repaired or replaced during PM, perform the applicable additional verifications.'},
 {s:'Completion',t:'Complete PM Event',fields:['completionCount','failures'],m:'Enter the completion Total Test Number, update failures/actions with anything found during PM, confirm documentation, then complete the PM event. The completed record remains in this instrument history.'}
 ]; return common;
}

function detailedInfo(x){
 const base={
 'PM Event Details':['Before maintenance begins, verify that you are working on the correct Account and fixed instrument identity (IN / SN).','Enter the Work Order for this visit. This value is unique to the current PM event and must not overwrite the instrument master.','Record the Total Test Number at the start of PM. Use this as the baseline for the visit and future test-volume tracking.','Record any failures, alarms, abnormal conditions or actions already known before maintenance. Add further findings as work progresses.'],
 'Bypass interlock, pause and unload reagent packs':['Bypass the interlock as directed by the current procedure.','Pause the console.','Remove the RSM reagent storage door.','Unload all reagent packs and store them refrigerated, upright, without handling the elastomeric seal.'],
 'Verify cooling fans':['With the RSM reagent storage door removed, verify that all three RSM cooling fans are running.','Verify the three instrument case fans and the main rear blower are operating.','Record any fan that is not running.'],
 'RSM nests and storage':['Inspect the pipetting nests and the inside of the reagent storage.','Remove fallen packs and debris. Do not reload fallen packs.','Wipe condensation from the module base.','Remove and clean the pipetting-nest cover; leave it off until reagent-pipettor alignments are complete when applicable.','Inspect and clean the tensioners at the front and rear of all four pipetting nests and verify free movement.'],
 'RSM top guide shaft and red bushing (D0518)':['Inspect the top guide shaft and the red bushing (D0518).','Clean any green debris from the top guide shaft and the bushing.','Replace the red bushing (D0518) if it is worn or damaged, or the debris returns.','Clean/lubricate the upper guide shaft and load-tray guide shaft with 3-in-1 oil; clean/lubricate the lower spline shaft with No. 2 Lithium Grease.'],
 'RSM gripper check':['Move the RSM gripper assembly left and right (Z-axis) and visually inspect how much gap appears at the top guide red bushing.','If a gap appears, suspect bending of the bottom Z-axis torque tube and record it.','Move the RSM gripper assembly up and down (X-axis) and check that the belt and the Z-axis torque tube barrier do not misalign.','Move the gripper to home and check for binding or snagged cables.','Refit the RSM reagent storage door.'],
 'Power off and disconnect':['The console is already paused (step 2).','Turn the instrument off using the approved procedure.','Disconnect the instrument power cord from the power source.'],
 'Tip Supply':['Open the tip-supply door and slide the assembly out far enough for inspection.','Inspect the tip-supply area for fallen tips, fragments and other debris.','Remove debris and clean only as needed.','Return the assembly and close the tip supply when the inspection is complete.'],
 'Sample Pipettors':['Move the sample pipettors to the left-most position to improve access.','Using DI water with a Kimwipe or lint-free swab, inspect and clean the sample pipettor mandrels and camera covers.','Inspect and clean the aliquot sample-pipettor backlight. If the instrument is connected to LAS, also inspect the second backlight at the automation line.','Visually inspect collision-detection sensor flags on aliquot and precision pipettors. If debris is present, clean the flag/clearance area and reinstall so the flag does not interfere with the die-casting base.'],
 'Bulk Feeder & Supply Shuttle':['Inspect the bulk vessel feeder, supply carriage and surrounding chassis.','Remove any fallen vessels.','Clean the supply-carriage alignment jumper pin with a moistened lint-free cloth.'],
 'Sample Presentation Unit (SPU)':['Inspect the SPU onload, presentation and offload areas for debris or spills, including the barcode-reader camera lens.','Clean the offload and onload sensors with a swab moistened with DI water.','Clean the rails, then manually slide a rack across them to confirm smooth movement.'],
 'Reagent Pipettors & Wash Towers':['Remove and clean the reagent-pipettor wash-tower nozzles. Inspect the tower/nozzle ports for debris.','Service the O-rings according to the PM procedure applicable to the instrument/released PM revision.','Do not use cotton swabs on wash-tower nozzles; the manual warns they can leave debris.','For 12-month/120,000-test PM, the supplied manual calls for reagent pipettor probe-tip replacement and specifies use of the probe-tip torque wrench.'],
 'Reagent Storage (RSM)':['Remove the front RSM cover and remove fallen packs/debris. Do not reload fallen packs.','Wipe condensation from the module base and remove/clean the pipetting-nest cover; leave it off until reagent-pipettor alignments are complete when applicable.','Inspect and clean tensioners at the front/rear of all four pipetting nests and verify free movement.','Clean/lubricate the upper guide shaft and load-tray guide shaft with 3-in-1 oil; clean/lubricate the lower spline shaft with No. 2 Lithium Grease.','Move the gripper to home if necessary and check for binding or snagged cables, then reinstall the front cover.'],
 'Wash Wheel & Pumps':['Replace the DxI 9000 peristaltic aspirate tubing. Do not substitute DxI 600/800 or Access 2 tubing.','Inspect pump rollers/cartridges, aspirate-probe tubing and Y-fittings; replace damaged components as needed.','Remove the wash-wheel cover and inspect/clean debris or spills. Inspect ejector plate hardware, mixer belt/pulleys, gripper/spinner/ejector assemblies and QS probe.','Install new aspirate probes and verify free vertical spring movement. Inspect substrate tubing movement and the wash-wheel camera.','For 12-month/120,000-test PM, clean/lubricate the wash-wheel syringe-pump drive gears and linear slides using the specified procedure.'],
 'Power on and initialize':['Reconnect/power on according to the approved power-on procedure and close all covers.','Initialize the instrument to GREEN (Ready).','Sign out of LabUser and sign in with the BeckmanAdmin account.','Follow the manual preparation steps before calibration/alignment, including the specified FalconProcessMonitoring Pass-folder housekeeping and entering YELLOW (Paused) state when directed.'],
 'Ultrasonic transducer calibration':['For each reagent pipettor, disconnect tubing at the transducer to drain fluid from the tip.','After draining, perform the approved Ultrasonics Transducer calibration and verify voltage.','Record any failure or abnormal result before continuing.'],
 '12-month alignments':['Align reagent pipettors to reagent shuttles, wash towers and reagent storage.','Align aliquot and precision sample pipettors to the applicable targets: disposable-tip tray holder, sample wheel, SPU sample shuttle, waste chutes and LAS track when applicable.','Auto-align the DispoTip stocker tray gripper.','Auto-align the wash wheel.'],
 'Prime all fluidics':['Prime all fluidics.','Inspect for leakage during/after priming.','Multiple prime cycles may be required to remove air. Continue until bubbles are no longer present.','If leakage or persistent bubbles remain, record the failure/action instead of marking the step complete without resolution.'],
 'RSM gripper timing':['Perform RSM gripper timing calibration using the approved calibration procedure.','Record the result and any corrective action if timing does not pass.'],
 'Reload reagents & RSM remap':['Reload the reagent packs removed at the start of PM.','Perform an RSM remap and confirm the expected packs are recognised.'],
 'Backup configuration & databases':['Back up alignment and configuration data.','Back up databases using the Service App.','The supplied procedure also directs removal of backup files older than six months in the specified backup locations.'],
 'PM Verification':['Perform the preventive-maintenance verification applicable to this PM type/released procedure.','If any additional component was repaired or replaced during PM, perform the applicable additional verification for that work.','Record failed verification, troubleshooting, repeat result and final status.'],
 'Complete PM Event':['Record the Total Test Number at completion.','Update Failures / Actions with all findings and corrective actions from the visit.','Confirm the Work Order and PM documentation are complete.','Completing this step writes a historical PM event; the next PM must create a new event rather than overwrite this one.']
 };
 return base[x.t]||[x.m];
}

let pmType='A',current=null;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PHASES=['Preparation & Verification','Initial Evaluation','Subsystem Maintenance','Calibration / Alignment / Prime','Verification','Completion'];
const FIELD_LABEL={wo:'Work Order',startCount:'Total Test Number at start',completionCount:'Total Test Number at completion',failures:'Failures / actions (write "None" if none)'};
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Could not save on this device: '+e.message)}}
function pad(n){return String(n).padStart(2,'0')}
function fmt(iso){if(!iso)return '—';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function phaseNo(s){return PHASES.indexOf(s)+1}
function statusOf(r){if(r.completed)return r.verdict||'Verified';return (r.answers||[]).some(a=>a&&a.result)?'In progress':'Not yet checked'}
function badge(s){const c={'Verified':'ok','Recheck required':'bad','In progress':'mid','Not yet checked':'idle'}[s]||'idle';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function mark(r,i){const a=r&&r.answers[i];if(!a||!a.result)return r&&i===r.step?'▶':'○';return a.result==='PASS'?'✓':a.result==='FAIL'?'✗':'–'}
function orderList(type,r){const steps=pmWorkflow(type,r?(r.wf||1):PM_WF);let html='',n=0;PHASES.forEach((p,pi)=>{const list=steps.map((x,i)=>({x,i})).filter(o=>o.x.s===p);if(!list.length)return;html+='<h3>'+(pi+1)+'. '+esc(p)+' <span class="muted">('+list.length+' step'+(list.length>1?'s':'')+')</span></h3><ol class="order" start="'+(n+1)+'">'+list.map(o=>'<li class="'+(r&&o.i===r.step&&!r.completed?'cur':'')+'"><span class="mk">'+mark(r,o.i)+'</span> '+esc(o.x.t)+(o.x.t==='12-month alignments'?' <span class="tag">PM-B only</span>':'')+'</li>').join('')+'</ol>';n+=list.length});return html}
const INST=((window.INSTRUMENTS||{}).instruments)||[];
function dkey(s){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||'');return m?m[3]+m[2]+m[1]:''}
function byIn(i){return INST.find(x=>x.in===String(i||'').trim())}
function sites(){return [...new Set(INST.map(x=>x.site))]}
function lastPm(x,t){const l=(x.pm||[]).filter(p=>p.type===t&&p.date).sort((a,b)=>dkey(b.date).localeCompare(dkey(a.date)));return l[0]}
function appRuns(i){return db.runs.filter(r=>r.instance===i)}
function instSummary(x){if(!x)return '';const a=lastPm(x,'PM-A'),b=lastPm(x,'PM-B'),mods=(x.history||[]).filter(h=>h.kind==='MOD');return '<div class="detail"><b>'+esc(x.site)+' · '+esc(x.label||'DxI 9000')+'</b><div class="muted">IN '+esc(x.in)+' · SN '+esc(x.sn||'not recorded')+(x.sw?' · SW '+esc(x.sw):'')+(x.apf?' · APF '+esc(x.apf):'')+(x.installed?' · Installed '+esc(x.installed):'')+'</div><div class="muted">Last PM-A (6M): '+(a?esc(a.date)+(a.text?' '+esc(a.text):''):'not recorded')+' · Last PM-B (12M): '+(b?esc(b.date)+(b.text?' '+esc(b.text):''):'not recorded')+'</div>'+(mods.length?'<div class="muted">MODs: '+mods.map(h=>esc(h.text)+(h.date?' ('+esc(h.date)+')':'')).join('; ')+'</div>':'')+'</div>'}
function picker(){if(!INST.length)return '';return '<label>Site<select class="field" id="site"><option value="">Select site (or type IN / SN below)</option>'+sites().map(s=>'<option>'+esc(s)+'</option>').join('')+'</select></label><label>Instrument<select class="field" id="inst" disabled><option value="">Select instrument</option></select></label><div id="instinfo"></div>'}
function wirePicker(pre){const se=$('site'),ie=$('inst');if(!se)return;function fill(){const list=INST.filter(x=>x.site===se.value);ie.innerHTML='<option value="">Select instrument</option>'+list.map(x=>'<option value="'+esc(x.in)+'">'+esc((x.label||'DxI 9000')+' · IN '+x.in+(x.sn?' · SN '+x.sn:''))+'</option>').join('');ie.disabled=!list.length}function pick(){const x=byIn(ie.value);$('instinfo').innerHTML=instSummary(x);if(x){$('in').value=x.in;$('sn').value=x.sn||''}}se.onchange=()=>{fill();pick()};ie.onchange=pick;$('in').oninput=()=>{const x=byIn($('in').value);$('instinfo').innerHTML=instSummary(x);if(x&&!$('sn').value)$('sn').value=x.sn||''};if(pre){const x=byIn(pre);if(x){se.value=x.site;fill();ie.value=x.in;pick()}else{$('in').value=pre}}}
function instruments(){$('app').innerHTML='<div class="card"><h2>Instruments</h2><p class="muted">'+INST.length+' DxI 9000 instruments at '+sites().length+' sites, imported from '+esc((window.INSTRUMENTS||{}).source||'')+' on '+esc((window.INSTRUMENTS||{}).imported||'')+'. PMs completed in this guide are added to each instrument.</p></div>'+sites().map(s=>'<div class="card"><h3 style="margin-top:0">'+esc(s)+' <span class="muted">('+INST.filter(x=>x.site===s).length+')</span></h3>'+INST.filter(x=>x.site===s).map(x=>{const runs=appRuns(x.in);const hist=[...(x.pm||[]).map(p=>({date:p.date,text:p.type+(p.text?' · '+p.text:''),kind:'PM'})),...(x.history||[]),...runs.filter(r=>r.completed).map(r=>({date:fmt(r.completed).slice(0,10),text:'PM-'+r.type+' completed in this guide · '+(r.verdict||'Verified'),kind:'PM'}))].sort((a,b)=>dkey(b.date).localeCompare(dkey(a.date)));const open=runs.find(r=>!r.completed);return '<details class="inst"><summary><b>'+esc(x.label||'DxI 9000')+'</b> · IN '+esc(x.in)+(x.sn?' · SN '+esc(x.sn):' · <span class="badge idle">SN not recorded</span>')+(open?' '+badge('In progress'):'')+'</summary>'+instSummary(x)+(hist.length?'<ul class="hist">'+hist.map(h=>'<li><span class="muted">'+esc(h.date||'date not recorded')+'</span> '+esc(h.text)+' <span class="tag">'+esc(h.kind)+'</span></li>').join('')+'</ul>':'<p class="muted">No PM or service history recorded.</p>')+'<div class="row"><button data-start="A" data-in="'+esc(x.in)+'">Start PM-A</button><button data-start="B" data-in="'+esc(x.in)+'">Start PM-B</button></div></details>'}).join('')+'</div>').join('');document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{pmType=b.dataset.start;home(b.dataset.in)})}
function home(pre){const steps=pmWorkflow(pmType);$('app').innerHTML='<div class="card"><h2>Start PM Instructions</h2><div class="row"><button id="a" class="'+(pmType==='A'?'on':'')+'">PM-A · Minor</button><button id="b" class="'+(pmType==='B'?'on':'')+'">PM-B · Major</button></div><p class="muted">PM-A 6-month / 60,000-test · PM-B 12-month / 120,000-test. Follow applicable volume scheduling and current OEM service manual.</p>'+picker()+'<label>Instrument IN<input class="field" id="in"></label><label>Serial Number<input class="field" id="sn"></label><label>Work Order<input class="field" id="wo"></label><label>Engineer<input class="field" id="engineer"></label><button class="primary" id="start">START PM-'+pmType+' →</button></div><div class="card"><h2>PM-'+pmType+' order · '+steps.length+' steps in 6 phases</h2><p class="muted">Work through the steps in this order. The guide opens one step at a time; a step is complete only when it has a result (PASS, FAIL or N/A), and FAIL or N/A needs an explanation. Use Back to correct an earlier step.'+(pmType==='B'?' PM-B adds the 12-month alignments and the 12-month replacement and lubrication tasks.':' PM-A leaves out the 12-month-only tasks.')+'</p>'+orderList(pmType)+'</div><div class="card warn">Field guide based on previously supplied DxI 9000 PM 3.1 procedures. Use current controlled Beckman Coulter Service Manual, safety precautions and trained personnel. Never substitute DxA procedures.</div>';wirePicker(pre);$('a').onclick=()=>{pmType='A';home($('in').value)};$('b').onclick=()=>{pmType='B';home($('in').value)};$('start').onclick=()=>{let x={id:String(Date.now()),type:pmType,wf:PM_WF,instance:$('in').value.trim(),sn:$('sn').value.trim(),wo:$('wo').value.trim(),engineer:$('engineer').value.trim(),step:0,answers:[],fields:{wo:$('wo').value.trim()},started:new Date().toISOString()};if(!x.instance||!x.sn)return alert('Enter IN and SN');db.runs.push(x);current=x.id;save();step()}}
function get(){return db.runs.find(x=>x.id===current)}
function fieldInput(f,v){const val=esc(v??'');if(f==='failures')return '<label>'+FIELD_LABEL[f]+'<textarea id="f_'+f+'" rows="2" class="field">'+val+'</textarea></label>';return '<label>'+FIELD_LABEL[f]+'<input class="field" id="f_'+f+'" value="'+val+'"'+(f!=='wo'?' inputmode="numeric"':'')+'></label>'}
function step(){let r=get();if(!r)return history();if(r.completed)return report(r);let steps=pmWorkflow(r.type,r.wf||1);if(r.step>=steps.length)return review(r);r.fields=r.fields||{wo:r.wo};let x=steps[r.step],z=r.answers[r.step]||{},details=detailedInfo(x),ref=manualReference(x.t),nx=steps[r.step+1];
$('app').innerHTML='<div class="card"><div class="muted">PM-'+r.type+' · Phase '+phaseNo(x.s)+' of 6: '+esc(x.s)+'</div><div class="muted">Step '+(r.step+1)+' of '+steps.length+' · IN '+esc(r.instance)+(byIn(r.instance)?' · '+esc(byIn(r.instance).site)+' '+esc(byIn(r.instance).label||''):'')+'</div><div class="bar"><i style="width:'+(r.step/steps.length*100)+'%"></i></div><h2>'+(r.step+1)+'. '+esc(x.t)+'</h2><p>'+esc(x.m)+'</p><div class="detail"><b>How to perform this step</b><ol>'+details.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ol></div>'+(ref?'<p class="muted">Manual 3.1 · '+esc(ref.figs.map(v=>v[1]+' '+v[2]).join('; '))+'</p>':'')+'<p class="warn">Confirm OEM-approved procedure and limits. Document failures; completion does not mean the instrument is safe for release.</p>'+(x.fields||[]).map(f=>fieldInput(f,r.fields[f])).join('')+'<label>Result<select id="result" class="field"><option value="">Select result</option><option>PASS</option><option>FAIL</option><option>N/A</option></select></label><label>Observations / measurements / actions<textarea id="notes" rows="3" class="field"></textarea></label><p class="muted">'+(nx?'Next: '+(r.step+2)+'. '+esc(nx.t)+(nx.s!==x.s?' (Phase '+phaseNo(nx.s)+': '+esc(nx.s)+')':''):'Next: completion check')+'</p><button class="primary" id="next">✓ COMPLETE & NEXT →</button><div class="row" style="margin-top:10px"><button id="back"'+(r.step?'':' disabled')+'>← Back</button><button id="pause">Save & Exit</button></div><details style="margin-top:14px"><summary>Show PM order and progress</summary>'+orderList(r.type,r)+'</details></div>';
$('result').value=z.result||'';$('notes').value=z.notes||'';
function draft(){r.answers[r.step]={result:$('result').value,notes:$('notes').value,time:new Date().toISOString()};(x.fields||[]).forEach(f=>{r.fields[f]=$('f_'+f).value.trim()});if(r.fields.wo)r.wo=r.fields.wo;save()}
$('result').onchange=draft;$('notes').oninput=draft;(x.fields||[]).forEach(f=>{$('f_'+f).oninput=draft});
$('next').onclick=()=>{draft();let v=r.answers[r.step];for(const f of (x.fields||[])){const val=r.fields[f];if(!val)return alert('Enter '+FIELD_LABEL[f]);if((f==='startCount'||f==='completionCount')&&!/^\d+$/.test(val))return alert(FIELD_LABEL[f]+' must be a whole number')}if(x.fields&&x.fields.includes('completionCount')&&Number(r.fields.completionCount)<Number(r.fields.startCount))return alert('Total Test Number at completion is lower than at start ('+r.fields.startCount+'). Check both numbers.');if(!v.result)return alert('Select a result');if(v.result!=='PASS'&&!v.notes.trim())return alert('Explain FAIL or N/A');r.step++;save();step()};
$('back').onclick=()=>{draft();if(r.step>0){r.step--;save();step()}};$('pause').onclick=()=>{draft();history()}}
function checks(r){const steps=pmWorkflow(r.type,r.wf||1),f=r.fields||{},missing=[],unexplained=[],failed=[];steps.forEach((x,i)=>{const a=r.answers[i];if(!a||!a.result)missing.push(i);else{if(a.result!=='PASS'&&!(a.notes||'').trim())unexplained.push(i);if(a.result==='FAIL')failed.push(i)}});const counts=/^\d+$/.test(f.startCount||'')&&/^\d+$/.test(f.completionCount||'')&&Number(f.completionCount)>=Number(f.startCount);return{steps,missing,unexplained,failed,counts,wo:!!(f.wo||r.wo),engineer:!!r.engineer}}
function line(ok,text,extra){return '<li class="'+(ok?'pass':'fail')+'"><span class="mk">'+(ok?'✓':'✗')+'</span> '+text+(extra||'')+'</li>'}
function review(r){const c=checks(r),hard=!c.missing.length&&!c.unexplained.length&&c.counts&&c.wo;
$('app').innerHTML='<div class="card"><h2>Completion check · PM-'+r.type+'</h2><p class="muted">IN '+esc(r.instance)+' · SN '+esc(r.sn)+' · Started '+fmt(r.started)+'</p><ul class="checks">'+line(!c.missing.length,'All '+c.steps.length+' steps have a result',c.missing.length?' — missing: '+c.missing.map(i=>'<button class="link" data-go="'+i+'">'+(i+1)+'. '+esc(c.steps[i].t)+'</button>').join(' '):'')+line(!c.unexplained.length,'Every FAIL or N/A has an explanation',c.unexplained.length?' — '+c.unexplained.map(i=>'<button class="link" data-go="'+i+'">'+(i+1)+'</button>').join(' '):'')+line(c.counts,'Total Test Number recorded at start and completion (completion not lower than start)')+line(c.wo,'Work Order recorded')+line(!c.failed.length,c.failed.length?c.failed.length+' step(s) failed — the PM will be marked Recheck required':'No failed steps')+'</ul>'+(hard?'<label>Engineer<input class="field" id="eng" value="'+esc(r.engineer)+'"></label><label class="confirm"><input type="checkbox" id="ok"> I confirm every step was performed in the order shown, following the current controlled Beckman Coulter service manual.</label><button class="primary" id="done" disabled>Confirm PM complete</button>':'<p class="warn">Complete the items marked ✗ before the PM can be confirmed.</p>')+'<div class="row" style="margin-top:10px"><button id="back">← Back to last step</button><button id="exit">Save & Exit</button></div></div>';
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{r.step=Number(b.dataset.go);save();step()});
$('back').onclick=()=>{r.step=c.steps.length-1;save();step()};$('exit').onclick=history;
if(hard){$('ok').onchange=()=>{$('done').disabled=!$('ok').checked};$('done').onclick=()=>{const e=$('eng').value.trim();if(!e)return alert('Enter the engineer name');r.engineer=e;r.completed=new Date().toISOString();r.verdict=c.failed.length?'Recheck required':'Verified';save();report(r)}}}
function history(){$('app').innerHTML='<div class="card"><h2>Saved PM Records</h2>'+(db.runs.length?'':'<p class="muted">No PM records on this device yet.</p>')+db.runs.slice().reverse().map(r=>'<div style="padding:12px 0;border-bottom:1px solid #eee"><b>PM-'+esc(r.type)+' · IN '+esc(r.instance)+'</b> '+badge(statusOf(r))+'<div class="muted">SN '+esc(r.sn)+' · '+(r.completed?'Completed '+fmt(r.completed):'Step '+Math.min(r.step+1,pmWorkflow(r.type,r.wf||1).length)+' of '+pmWorkflow(r.type,r.wf||1).length+' · Started '+fmt(r.started))+'</div><button data-id="'+r.id+'">'+(r.completed?'Open report':'Open / Resume')+'</button></div>').join('')+'</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;step()})}
function report(r){const steps=pmWorkflow(r.type,r.wf||1),f=r.fields||{};let n=0;
$('app').innerHTML='<div class="card"><h2>PM-'+r.type+' Checklist Completed '+badge(r.verdict||'Verified')+'</h2><p>'+(byIn(r.instance)?esc(byIn(r.instance).site)+' · '+esc(byIn(r.instance).label||'')+'<br>':'')+'IN '+esc(r.instance)+' · SN '+esc(r.sn)+' · WO '+esc(f.wo||r.wo)+'</p><p class="muted">Engineer '+esc(r.engineer)+' · Started '+fmt(r.started)+' · Completed '+fmt(r.completed)+'<br>Total Test Number '+esc(f.startCount)+' → '+esc(f.completionCount)+'</p><p class="warn">Checklist complete is NOT authorisation for return to service. Review failures, perform final verification and obtain required release approval.</p>'+PHASES.map((p,pi)=>{const list=steps.map((x,i)=>({x,i})).filter(o=>o.x.s===p);if(!list.length)return '';return '<h3>'+(pi+1)+'. '+esc(p)+'</h3>'+list.map(o=>{const a=r.answers[o.i]||{};return '<div style="border-bottom:1px solid #eee;padding:9px 0"><b>'+(o.i+1)+'. '+esc(o.x.t)+'</b> — '+esc(a.result)+'<div class="muted">'+esc(a.notes)+'</div></div>'}).join('')}).join('')+'<p class="muted">Failures / actions: '+esc(f.failures)+'</p><button class="primary" onclick="window.print()">Print / Save PDF</button></div>'}
$('setup').onclick=()=>home();$('instruments').onclick=instruments;$('records').onclick=history;home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
